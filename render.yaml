# Render Blueprint for the RooMates API (Render dashboard -> New -> Blueprint).
# Infrastructure as code: region, commands and env keys live here, reviewed like code.
# Secrets are NOT in this file: keys marked `sync: false` are asked for once
# when the Blueprint is first created, and are then stored in Render only.
# The frontend is on Vercel (https://roomatess.vercel.app), not in this file.
services:
  - type: web
    name: roomates-api
    runtime: node
    # Same region as the Neon database (AWS ap-southeast-1). A different region
    # adds a round trip to every query.
    region: singapore
    plan: free
    rootDir: Backend
    # --include=dev: NODE_ENV=production would otherwise skip devDependencies,
    # and the TypeScript compiler is one.
    buildCommand: npm ci --include=dev && npm run build
    # Pending migrations run inside startup (src/config/migrate.ts).
    startCommand: npm start
    healthCheckPath: /api/health
    # Deploy a push to main only after GitHub CI passes.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # One proxy (Render's) in front of the app; rate limits need the real client IP.
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        value: https://roomatess.vercel.app
      # Random value generated by Render on first deploy. Never the local one.
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: "30"
      - key: EMAIL_FROM_NAME
        value: RooMates
      - key: EMAIL_FROM_ADDRESS
        value: hello.roomatess@gmail.com

      # Secrets: entered in the Render dashboard, copied from Backend/.env.
      # Neon, pooling OFF (no "-pooler" in the host).
      - key: DATABASE_URL
        sync: false
      - key: APP_DB_PASSWORD
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CONTACT_INBOX
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
